<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZKESS · Lender</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap">
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#16271f;--muted:#5d6e66;--line:#d8e2dc;--c:#1f8f84;--a:#d4577f;--gold:#e9ad3a;--dead:#9aa7a0;--field:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a16;--card:#16251f;--ink:#e8f1ec;--muted:#9bb0a6;--line:#2a3d34;--c:#2fb3a5;--a:#e5799c;--field:#101d18}}
:root[data-theme="dark"]{--bg:#0e1a16;--card:#16251f;--ink:#e8f1ec;--muted:#9bb0a6;--line:#2a3d34;--c:#2fb3a5;--a:#e5799c;--field:#101d18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
:root{--g1:rgba(31,143,132,.28);--g2:rgba(212,87,127,.24)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:rgba(47,179,165,.24);--g2:rgba(229,121,156,.2)}}
:root[data-theme="dark"]{--g1:rgba(47,179,165,.24);--g2:rgba(229,121,156,.2)}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 25%,var(--g1),transparent 42%),radial-gradient(circle at 82% 72%,var(--g2),transparent 44%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.55}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{max-width:1040px;margin:0 auto;padding:20px 20px 0}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0}h1{font-size:28px}h2{font-size:22px;margin:4px 0 10px}
.sub{color:var(--muted);margin:4px 0 0}
.wrap{max-width:1040px;margin:0 auto;padding:12px 20px 30px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:22px}
svg{width:100%;height:auto;display:block;max-height:560px}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pt{stroke:rgba(60,10,30,.3);stroke-width:1;cursor:pointer;transition:filter .2s}
.pt.cu{fill:url(#gcu)}.pt.ad{fill:url(#gad)}.pt.dead{fill:url(#gdd)}.pt.gd{fill:url(#ggd)}.pt.empty{fill:url(#gem);opacity:.95}.pt.empty:hover{opacity:1}
.list{display:grid;gap:6px;margin:10px 0}.li{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.li .muted{grid-column:2}.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;grid-row:1/3}.dot.ad{background:var(--a)}.dot.cu{background:var(--c)}.dot.gd{background:#d4202f}.dot.dead{background:var(--dead)}
.pt.sel{filter:drop-shadow(0 0 7px var(--gold));stroke:var(--gold);stroke-width:3}
.pt.ghost{fill:none;stroke:var(--muted);stroke-dasharray:6 6;stroke-width:2;animation:pulse 1.8s ease-in-out infinite}
.pt.ghost.sel{stroke:var(--gold);filter:none}
.pl{fill:#fff;stroke:rgba(40,0,20,.4);stroke-width:3px;paint-order:stroke;font-family:Fraunces,Georgia,serif;font-weight:700;pointer-events:none;text-anchor:middle}
.pl.g{fill:var(--muted);stroke:none}
.grow{transform-origin:250px 250px;animation:grow .7s cubic-bezier(.2,.9,.3,1.2)}
#hub{fill:url(#cen);stroke:#8a5410;stroke-width:2}.bloom #hub{fill:url(#cen2)}
.hub1{fill:#2b1d00;font:700 15px Fraunces,Georgia,serif;text-anchor:middle}.hub2{fill:#4a3205;font-size:11px;font-weight:600;text-anchor:middle}.bloom .hub1,.bloom .hub2{fill:#2b1d00}
.bloom #petals{transform-origin:250px 250px;animation:sway 5s ease-in-out infinite}
@keyframes grow{from{transform:scale(.1);opacity:0}}@keyframes pulse{50%{opacity:.35}}@keyframes sway{50%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.who{font-weight:700;font-size:13px}.who.c{color:var(--c)}.who.a{color:var(--a)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}label{font-size:13px;font-weight:650}
input,select{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font:inherit;background:var(--field);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
input[readonly]{opacity:.7}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}textarea{width:100%;min-height:78px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;background:var(--field);color:var(--ink);resize:vertical}textarea:focus{outline:3px solid var(--gold);outline-offset:1px}
.btn{--bc:var(--c);width:100%;border:0;border-radius:999px;padding:13px 18px;font:inherit;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.12) 45%,rgba(0,0,0,.05) 52%,rgba(0,0,0,.25) 100%),var(--bc);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -3px 6px rgba(0,0,0,.25),0 5px 0 color-mix(in srgb,var(--bc) 50%,#000),0 10px 16px rgba(0,0,0,.28);cursor:pointer;margin:6px 0 12px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.25),0 1px 0 color-mix(in srgb,var(--bc) 50%,#000),0 4px 8px rgba(0,0,0,.25)}
.btn.a{--bc:var(--a)}.btn.g{--bc:#6c7d75}.btn.r{--bc:#b3402f}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.rows div{background:var(--bg);border-radius:8px;padding:8px 10px}.rows small{display:block;color:var(--muted);font-size:11px}.rows b{overflow-wrap:anywhere}
.note{border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;background:var(--bg);border:1px solid var(--line)}
.note.w{border-color:var(--gold)}.err{color:#c0392b;font-size:13px;min-height:18px}
.muted{color:var(--muted);font-size:12px}
.wa{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}.wa h3{margin:0 0 6px;font-size:14px}.msg{font-size:13px;border-radius:8px;padding:7px 10px;margin:6px 0;background:var(--bg)}.msg.cu{border-left:3px solid var(--c)}.msg.ad{border-left:3px solid var(--a)}.msg a{color:var(--c);font-weight:700}.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:8px 0}.ck input{width:18px;height:18px;flex:none;margin-top:2px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.rows,.two{grid-template-columns:1fr}}
</style></head><body>
<header><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1>EZKESS</h1><button class="btn g" id="tg" style="width:auto;padding:8px 20px;margin:0 0 6px" onclick="toggleTheme()" aria-label="Switch between light and dark mode">Dark mode</button></div><p class="sub">Every loan request is a petal around the admin. Open a petal to see that customer’s own flower, built step by step until the loan is complete. <span id="st" class="muted"></span></p></header>
<div class="wrap">
<div class="card"><svg id="svg" viewBox="0 0 500 500" role="img" aria-label="Loan flower"></svg>
<div class="legend"><span><i style="background:var(--c)"></i>Customer’s turn</span><span><i style="background:var(--a)"></i>Admin’s turn</span><span><i style="background:#d4202f"></i>Completed</span></div></div>
<div class="card" id="panel"></div></div>
<script>
const ROLE="admin",MINE="a";
const WAITING='<p class="muted">'+(ROLE==="admin"?"Waiting for the customer to complete this step.":"Waiting for the lender. You will get a WhatsApp message when it is your turn.")+'</p>';
const P=[{k:"req",w:"c",t:"Request",h:"Loan request"},{k:"offer",w:"a",t:"Review",h:"Admin reviews the profile"},{k:"resp",w:"c",t:"Response",h:"Customer response"},{k:"tx",w:"a",t:"Transaction",h:"Funds sent"},{k:"rec",w:"c",t:"Receipt",h:"Customer confirms receipt"},{k:"done",w:"a",t:"Complete",h:"Disbursement confirmed"}];
let S={},sel=0,fresh=-1,view=ROLE==="admin"?"home":"cust",apps=[],cur=-1,hf=-1,lw="18685550100",vault=[],vsel=-1;
const $=id=>document.getElementById(id),v=id=>($(id)?$(id).value.trim():""),
esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),
fm=n=>Number(n).toLocaleString("en-TT",{minimumFractionDigits:2,maximumFractionDigits:2}),
nx=()=>S.ended?-1:P.findIndex(p=>!S[p.k]),now=()=>new Date().toLocaleString();
function err(m){$("err").textContent=m}
function add(k,rows,extra){S[k]=Object.assign({at:now(),rows},extra||{});fresh=P.findIndex(p=>p.k===k);const n=nx();sel=n<0?fresh:n;render()}
function pick(i){sel=i;render()}
function setLw(x){lw=wn(x.trim());render()}
function openVault(i){view="vault";vsel=i==null?-1:i;render()}
function saveVault(o,nt){const q=S.req;let f=vault.find(x=>x.key===q.wa);if(!f){f={key:q.wa,txs:[]};vault.push(f)}
 Object.assign(f,{name:q.name,mobile:q.mobile,email:q.email,address:q.address,ids:q.ids});
 f.txs.push({o,rows:[["Loan","TT$ "+fm(S.offer.principal)+" · "+q.term+" · "+q.rows.find(r=>r[0]==="Purpose")[1]],["Repayment","TT$ "+fm(S.offer.total)+" in total, TT$ "+fm(S.offer.inst)+" per installment from "+S.offer.first],["Delivery",S.resp.method+": "+S.tx.rows.map(r=>r[1]).join(", ")],["Verification","2 IDs, WhatsApp location and WhatsApp voice note"],["Timeline","Requested "+S.req.at+"; offer "+S.offer.at+"; accepted "+S.resp.at+"; funds sent "+S.tx.at+"; received "+S.rec.at+"; disbursed "+S.done.at],["Outcome",o],["Admin notes",nt||"None"],["Saved to vault",now()]]})}
function vaultPanel(){
 let h='<button class="btn g" style="margin:0 0 12px" onclick="goHome()">← All requests</button><div class="who a">Admin</div><h2>Vault</h2>';
 if(!vault.length)return $("panel").innerHTML=h+'<div class="note">No files yet. When a transaction is finished, its summary is saved here as a customer file.</div>';
 if(vsel<0||vsel>=vault.length)return $("panel").innerHTML=h+'<p class="muted">One file per customer. Open a file to read every transaction in it.</p><div class="list">'+vault.map((f,i)=>`<button class="li" onclick="openVault(${i})"><span class="dot gd"></span><b>${esc(f.name)}</b><span class="muted">${f.txs.length} transaction${f.txs.length>1?"s":""} · last: ${esc(f.txs[f.txs.length-1].o)}</span></button>`).join("")+'</div>';
 const f=vault[vsel];
 $("panel").innerHTML=h+`<button class="btn g" style="margin:0 0 12px" onclick="openVault()">← All files</button><h2>${esc(f.name)}</h2>${R([["Mobile",f.mobile],["Email",f.email],["Address",f.address],["IDs on file",f.ids]])}`+f.txs.map((t,i)=>`<div class="wa"><h3>Transaction ${i+1}</h3>${R(t.rows)}</div>`).join("")}
function goHome(i){view="home";hf=i==null?-1:i;render()}
function openCust(i){S=apps[i];cur=i;view="cust";fresh=-1;const n=nx();sel=n<0?P.reduce((m,p,j)=>S[p.k]?j:m,0):n;render()}
function newReq(){S={};cur=-1;view="cust";sel=0;fresh=-1;render()}
function turn(s){if(s.ended)return"dead";if(s.done)return"gd";return P[P.findIndex(p=>!s[p.k])].w==="a"?"ad":"cu"}
function lab(s){if(s.ended)return"closed";if(s.done)return"loan active";const p=P[P.findIndex(p=>!s[p.k])];return(p.w==="a"?"you":"customer")+": "+p.t.toLowerCase()}
function draw(){view==="cust"?drawCust():drawHome()}
function drawHome(){
 const N=apps.length,M=Math.max(N,8),rx=Math.min(44,380/M),ry=Math.min(74,30+270/M),cy=196-ry,d=54+ry;let g="";
 for(let i=N;i<M;i++)g+=`<g aria-hidden="true" filter="url(#sh)"><g transform="rotate(${i*360/M} 250 250)">${pet("pt empty",cy,rx,ry)}</g></g>`;
 apps.forEach((s,i)=>{const a=i*360/M,r=a*Math.PI/180,x=250+d*Math.sin(r),y=250-d*Math.cos(r),ini=s.req.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  g+=`<g class="${i===hf?"grow":""}" onclick="openCust(${i})" role="button" tabindex="0" aria-label="${esc(s.req.name)}" filter="url(#sh)"><g transform="rotate(${a} 250 250)">${pet("pt "+turn(s),cy,rx,ry,s.req.name)}</g>${rx>=18?`<text class="pl" x="${x}" y="${y+5}" font-size="${Math.min(22,rx*.7)}">${esc(ini)}</text>`:""}</g>`});
 hf=-1;const need=apps.filter(s=>turn(s)==="ad").length;
 $("svg").setAttribute("class","");
 $("svg").innerHTML=`<g id="petals">${g}</g><circle id="hub" cx="250" cy="250" r="66"/><text class="hub1" x="250" y="246">Admin</text><text class="hub2" x="250" y="264">${N} request${N===1?"":"s"}</text>${N?`<text class="hub2" x="250" y="280">${need} need you</text>`:'<text class="hub2" x="250" y="280">no requests yet</text>'}`}
function homePanel(){
 let h='<div class="who a">Admin</div><h2>Pending requests</h2><p class="muted">Each petal is one customer. Open a petal to see that customer’s flower. Rose means your turn, teal means waiting on the customer, red means finished and saved in the vault, grey means closed.</p>';
 h+=apps.length?`<div class="list">${apps.map((s,i)=>`<button class="li" onclick="openCust(${i})"><span class="dot ${turn(s)}"></span><b>${esc(s.req.name)}</b><span class="muted">TT$ ${fm(s.req.amount)} · ${esc(lab(s))}</span></button>`).join("")}</div>`:'<div class="note">No requests yet. Customers send requests from the customer page, and each one appears here as a petal.</div>';
 $("panel").innerHTML=h+`<div class="field" style="margin-top:12px"><label for="lw">Admin WhatsApp number</label><input id="lw" type="tel" value="${esc(lw?"+"+lw:"")}" placeholder="868 555 0100" onchange="setLw(this.value)"><span class="muted">Customers share their WhatsApp location with this number. A 7-digit number is treated as +1 868.</span></div>`+'<button class="btn g" onclick="openVault()">Open the vault ('+vault.length+' file'+(vault.length===1?'':'s')+')</button>'+(ROLE==="admin"?'<button class="btn g" onclick="logout()">Sign out</button>':"")}
function drawCust(){
 let g="",n=nx(),end=S.ended?P.reduce((m,p,i)=>S[p.k]?i:m,0):-1;
 P.forEach((p,i)=>{const done=!!S[p.k];if(!done&&i!==n)return;
  const a=i*60,r=a*Math.PI/180,lx=250+116*Math.sin(r),ly=250-116*Math.cos(r);
  const cls="pt "+(done?"gd":"ghost")+(i===end?" dead":"")+(i===sel?" sel":"");
  g+=`<g class="${i===fresh?"grow":""}" onclick="pick(${i})" role="button" tabindex="0" aria-label="${p.t}"${done?' filter="url(#sh)"':""}><g transform="rotate(${a} 250 250)">${pet(cls,130,44,74)}</g><text class="pl${done?"":" g"}" x="${lx}" y="${ly}"><tspan x="${lx}" y="${ly}" font-size="24">${i+1}</tspan><tspan x="${lx}" dy="17" font-size="11">${p.t}</tspan></text></g>`});
 fresh=-1;
 const c=P.filter(p=>S[p.k]).length,st=S.ended?"closed":S.done?"LOAN ACTIVE":S.hold?"on hold":["waiting","request in","offer sent","accepted","funds sent","received"][c];
 $("svg").setAttribute("class",S.done?"bloom":"");
 $("svg").innerHTML=`<g id="petals">${g}</g><circle id="hub" cx="250" cy="250" r="66"/><text class="hub1" x="250" y="246">${esc((S.req?S.req.name.split(" ")[0]:"New").slice(0,10))}</text><text class="hub2" x="250" y="264">${st}</text>${S.req?`<text class="hub2" x="250" y="280">TT$ ${fm(S.req.amount)}</text>`:""}`;
}
const R=(rows)=>`<div class="rows">${rows.map(r=>`<div><small>${esc(r[0])}</small><b>${esc(r[1])}</b></div>`).join("")}</div>`;
const F=(id,l,t,val,x)=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" type="${t||"text"}" value="${esc(val||"")}" ${x||""}></div>`;
const sec=(h)=>`<p class="err" id="err" role="alert"></p>`;
const FORMS=[
()=>`<p class="muted">The customer fills this in. Sending it grows the first petal.</p>${F("n","Full legal name")}<div class="two">${F("m","WhatsApp mobile number","tel","",'placeholder="868 555 1234"')}${F("am","Amount requested (TT$)","number","","min=1 step=0.01")}</div><div class="two">${F("em","Email (optional)","email")}${F("rf","Referral code (optional)")}</div><div class="two"><div class="field"><label for="tm">Repayment period</label><select id="tm"><option value="">Choose</option>${[1,3,6,9,12].map(x=>`<option>${x} month${x>1?"s":""}</option>`).join("")}</select></div><div class="field"><label for="pu">Purpose</label><select id="pu"><option value="">Choose</option>${["Household expenses","Medical expenses","Education","Vehicle or transport","Business","Other"].map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class="two"><div class="field"><label for="it">ID document type</label><select id="it"><option value="">Choose</option><option>National ID card</option><option>Passport</option><option>Driver’s permit</option></select></div>${F("if","Attach your ID (photo or PDF)","file","",'accept="image/*,application/pdf" onchange="prev(this)"')}</div><div class="two"><div class="field"><label for="i2">Second ID belongs to</label><select id="i2"><option value="">Choose</option><option>Guarantor’s ID</option><option>Referrer’s ID</option><option>Work ID</option></select></div>${F("f2","Attach second ID (photo or PDF)","file","",'accept="image/*,application/pdf" onchange="prev(this)"')}</div><div class="two">${F("rn","Name of the second ID holder")}${F("rp","Their WhatsApp or phone number","tel")}</div>${F("ad","Home address")}${F("lo","WhatsApp location (paste the shared location link or coordinates)")}${lw?`<div class="note"><b>Send your location to the admin’s WhatsApp number</b><br><span style="font-size:20px;font-weight:700">+${esc(lw)}</span><br>Stand at your home address, open WhatsApp, tap Location, then Send your current location to this number. <a href="https://wa.me/${esc(lw)}?text=${encodeURIComponent("Hello, this is my home location for my loan request.")}" target="_blank" rel="noopener">Open the WhatsApp chat</a></div>`:'<div class="note w"><b>Admin WhatsApp number not set.</b> The admin must enter the number on the requests page before customers can share a location.</div>'}<p class="muted">Two IDs are required. The lender also verifies you on WhatsApp using your number above. Demo: only file names and the pasted location are recorded.</p><div class="field"><label for="ms">Additional information (optional)</label><textarea id="ms" placeholder="Anything you would like the lending team to know"></textarea></div><div class="note"><b>What happens after you submit?</b><br>Your request, IDs and location are recorded for administrator review. Submission is not approval and does not create a loan agreement. Never share your online banking password, PIN, card CVV or one-time banking code with the lender.</div><label class="ck"><input type="checkbox" id="co"><span>I confirm that the information is accurate and consent to its use to assess this request. *</span></label>${sec()}<button class="btn" onclick="s0()">Send request</button>`,
()=>S.rv?OFFERF():REVIEWF(),
()=>`${R(S.offer.rows)}<div class="field"><label for="me">How should the funds reach you?</label><select id="me" onchange="$('bk').style.display=this.value==='Bank transfer'?'block':'none'"><option value="">Choose</option><option>Bank transfer</option><option>Hand collection</option></select></div><div id="bk" style="display:none">${F("bn","Bank name")}${F("bh","Account holder")}${F("ba","Account number")}<p class="muted">Never enter a PIN, password or card security code.</p></div>${sec()}<button class="btn" onclick="s2(true)">Accept offer</button><button class="btn g" onclick="s2(false)">Decline offer</button>`,
